- title: "ROS 2 autonomy demos: fast mapping and cleaning missions"
  meta: "iRobot · 2025 · engineering manager · internal project"
  description: >-
    I led a partly new team through two live demos of iRobot's new ROS 2
    autonomy stack, both presented to the executive team, guiding the
    mapping, planning and ML subteams. In the first, a robot built a map of
    its environment quickly, alongside an ML demo of our revived stack running
    on a production robot. I set up the robots remotely and tracked the health
    of the demo day to day. In the second, the robot loaded a map it had
    built earlier and used it to clean, following systematic cleaning paths
    and responding to cliffs and other hazards. A live ML demo on new hardware
    and sensors showed object detection, floor-type segmentation and room
    identification.
  links: []

- title: "Smaller iRobot projects"
  meta: "iRobot · 2021–2026"
  description: >-
    Other pieces of mapping and product work, from features I built myself to
    ones I coordinated across teams:
  bullets:
    - "<strong>map2geojson (2024–2026):</strong> Python scripts converting new map formats from OEM partners, running in AWS Lambda. Similar in spirit to map2json but simpler, with very few production errors."
    - "<strong>Visual Dirt Detective (2023):</strong> project manager, coordinating several mapping and planning subteams. I also wrote the C++ code on the robot that extracts polygons from the semantic map."
    - "<strong>Clutter fields (2023):</strong> marking whole cluttered areas the robot should avoid so it doesn't get stuck, using simple morphological opening and closing on the map."
    - "<strong>No-mop zones (2022):</strong> as squad lead I coordinated the feature end to end, and implemented the map2json side."
    - "<strong>Shared maps between robots (2021–2022):</strong> letting a mop and a vacuum share one map. Combined mop-and-vacuum robots made ongoing sharing unnecessary, but it was used for a one-time copy, so a new robot could start with an existing map instead of mapping the same home again."
    - "<strong>Coverage polygons (2021):</strong> drawing where the robot cleaned from its trajectory, instead of from grid cells. Clearer for users, and it looked much better in the app."
    - "<strong>Autorotation (2021):</strong> improved how maps are automatically aligned, reducing mean rotation error from 3.1° to 1.99°."
  links: []

- title: "map2json: robot maps in the cloud"
  meta: "iRobot · 2021 · owner and sole developer"
  description: >-
    A C++ translation layer between the maps Roombas build and the format the
    iRobot app shows, running in AWS Lambda. It works both ways: robot maps go
    to the app, and the user's edits in the app (renaming rooms, moving
    dividers) go back to the robot. Running in the cloud meant fixes could
    reach production without waiting for a robot software update, and heavier
    algorithms could run there for robots with limited hardware. In early
    2021 a firmware update left some Roombas acting "drunk". I was on the map
    remediation team, and we used map2json to repair affected maps in the
    cloud.
  figure: map2json.svg
  links:
    - label: "BBC News: 'drunk' Roombas after a software update (2021)"
      url: "https://www.bbc.co.uk/news/technology-56239454"

- title: "CNN clutter classification"
  meta: "iRobot · 2017–2018, PyTorch port 2022"
  description: >-
    Room segmentation works better when the map separates walls from clutter
    such as furniture. I trained a small pixel-wise CNN on hand-annotated maps
    (using an annotation tool) to classify each occupied pixel as wall or
    clutter. Inference had to run on the robot itself, so I tried many
    architectures and kept the one with the best accuracy for its cost. I
    built it with a team lead and maintained it over the years, and in 2022 I
    ported it to PyTorch.
  links: []

- title: "RoomsSeg: room-by-room cleaning for Roomba"
  meta: "iRobot · 2015 onwards · IROS 2017"
  description: >-
    The robot builds a grid map while it cleans, and RoomsSeg turns it into
    rooms and hallways: it removes clutter from the map, then applies
    watershed segmentation. This lets the robot clean one room at a time, and
    users can name rooms and send the robot to them. I worked on this in C++
    from 2015, and much of my later work at iRobot built on it.
  image: roomseg.png
  links:
    - label: "Paper (IROS 2017)"
      url: "https://doi.org/10.1109/IROS.2017.8206429"
    - label: "IEEE Spectrum article"
      url: "https://spectrum.ieee.org/how-irobots-roomba-will-roomify-your-home"

- title: "Dense S-PTAM: real-time dense 3D maps from stereo SLAM"
  meta: "CIFASIS-CONICET, Rosario · 2017–2018 · Robotica 2018"
  description: >-
    S-PTAM is a stereo SLAM system that tracks the camera with a sparse set of
    points. Dense S-PTAM extends it to rebuild a full 3D point cloud of the
    environment in real time, from the poses S-PTAM estimates and the
    disparity maps computed from each stereo pair (with LIBELAS). It runs as a
    ROS node and was evaluated on the KITTI and Tsukuba datasets.
  image: dense-sptam.jpg
  links:
    - label: "Real-time dense map fusion for stereo SLAM (Robotica, 2018)"
      url: "https://doi.org/10.1017/S0263574718000528"
    - label: "Code (GitHub)"
      url: "https://github.com/CIFASIS/dense-sptam"
    - label: "S-PTAM"
      url: "https://github.com/lrse/sptam"

- title: "Modelling and rendering bread"
  meta: "PhD · CIFASIS-CONICET, Rosario · 2011–2016"
  description: >-
    My PhD built a computational model of bread making. It simulates proving
    and baking to produce the inner structure and look of real bread, and
    checks the results against real bread with a multifractal error metric.
    The same ideas led to a more general method for generating porous
    materials procedurally.
  image: bread.jpg
  links:
    - label: "Procedural bread making (Computers & Graphics, 2015)"
      url: "https://doi.org/10.1016/j.cag.2015.05.003"
    - label: "Realistic modeling of porous materials (CAVW, 2017)"
      url: "https://publications-cgv01.ewi.tudelft.nl/papers/294"
    - label: "Multifractal classification of bread crumb (EURASIP JIVP, 2015)"
      url: "https://doi.org/10.1186/s13640-015-0063-8"

- title: "3D mapping with a time-of-flight camera"
  meta: "INRIA Grenoble, E-MOTION team · 2010–2011"
  description: >-
    Real-time 3D mapping of indoor spaces from a moving robot. A Swissranger
    SR4000 camera gives 3D point clouds, and 2D SLAM gives the robot's
    position, so the two combine into a 3D map. Written in C++ with ROS.
  image: inria.jpg
  links:
    - label: "INRIA technical report (2011)"
      url: "https://inria.hal.science/inria-00594908"

- title: "A GPU framework for real-time materials"
  meta: "Licentiate thesis · Universidad Nacional de Rosario · 2010"
  description: >-
    Photographic textures are fixed in size, repeat when reused and carry
    baked-in lighting. This thesis built a framework that represents natural
    materials such as stone by composing simple mathematical functions, and
    renders them in real time with GPU shaders (Cg), so no textures need to be
    stored.
  image: textures.jpg
  links:
    - label: "Thesis (in Spanish, PDF)"
      url: "https://dcc.fceia.unr.edu.ar/sites/default/files/tesinas/26.pdf"
    - label: "Thesis page"
      url: "https://dcc.fceia.unr.edu.ar/es/lcc/tesinas-grado/tesinas/un-framework-en-gpu-para-representar-y-renderizar-materiales-en-tiempo"
