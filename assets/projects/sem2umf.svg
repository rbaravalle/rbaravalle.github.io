<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 720 200" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Maps flow from the robot through sem2umf in the cloud to the app; user edits flow back from the user through the app and sem2umf to the robot">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb4ff"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b766"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <g fill="#232938" stroke="#4a5368" stroke-width="1.5">
    <rect x="20"  y="85" width="130" height="80" rx="8"/>
    <rect x="245" y="70" width="190" height="110" rx="8" stroke="#7fb4ff"/>
    <rect x="530" y="85" width="80"  height="80" rx="8"/>
  </g>
  <text x="85"  y="122" text-anchor="middle" font-size="18" fill="#d6dae4" font-weight="bold">Robot</text>
  <text x="85"  y="145" text-anchor="middle" font-size="12" fill="#8a93a6">maps the home</text>

  <text x="340" y="112" text-anchor="middle" font-size="18" fill="#d6dae4" font-weight="bold">sem2umf</text>
  <text x="340" y="134" text-anchor="middle" font-size="12" fill="#8a93a6">C++ map translation</text>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#8a93a6">AWS Lambda (cloud)</text>

  <text x="570" y="130" text-anchor="middle" font-size="18" fill="#d6dae4" font-weight="bold">App</text>

  <!-- User -->
  <g fill="none" stroke="#d6dae4" stroke-width="2">
    <circle cx="680" cy="108" r="11"/>
    <path d="M660,152 q20,-32 40,0"/>
  </g>
  <text x="680" y="175" text-anchor="middle" font-size="14" fill="#d6dae4">User</text>

  <!-- Map flow: robot -> sem2umf -> app -->
  <g stroke="#7fb4ff" stroke-width="2.5" fill="none" marker-end="url(#a-blue)">
    <path d="M150,110 L243,110"/>
    <path d="M435,110 L528,110"/>
  </g>
  <text x="340" y="50" text-anchor="middle" font-size="14" fill="#7fb4ff">robot map → app format</text>

  <!-- Edit flow: user -> app -> sem2umf -> robot -->
  <g stroke="#f2b766" stroke-width="2.5" fill="none" marker-end="url(#a-amber)">
    <path d="M662,145 L612,145"/>
    <path d="M530,145 L437,145"/>
    <path d="M245,145 L152,145"/>
  </g>
  <text x="340" y="212" text-anchor="middle" font-size="14" fill="#f2b766">user edits (rename rooms, move dividers, …) → robot format</text>
</svg>
