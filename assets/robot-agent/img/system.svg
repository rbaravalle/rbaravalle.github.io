  <text x="166" y="116" class="t" text-anchor="start">The house: walls, doors, one exit.</text>
  <text x="166" y="133" class="t" text-anchor="start">Physics: a move advances 1 cm at</text>
  <text x="166" y="150" class="t" text-anchor="start">a time; if the body would touch a</text>
  <text x="166" y="167" class="t" text-anchor="start">wall, it stops there: BUMP.</text>
  <text x="166" y="184" class="t" text-anchor="start">Lidar: 72 rays, one every 5°.</text>
  <text x="166" y="201" class="t" text-anchor="start">Judges success: centre outside.</text>
  <line x1="80" y1="296" x2="80" y2="244" stroke="#ffcb6b" stroke-width="2" marker-end="url(#a-yellow)"/>
  <text x="90" y="274" class="lab" text-anchor="start">move(1.0) or turn(45)</text>
  <line x1="360" y1="244" x2="360" y2="296" stroke="#c3e88d" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="350" y="274" class="lab" text-anchor="end">result + scan</text>
  <rect x="28" y="304" width="370" height="178" rx="12" fill="#232838" stroke="#7fb4ff" stroke-width="1.5"/>
  <text x="44" y="328" class="h" text-anchor="start">Agent loop  (agent.py)</text>
  <text x="44" y="352" class="t" text-anchor="start">1. Turns the result into a log entry:</text>
  <text x="60" y="369" class="small" text-anchor="start">“Step 12 ... BUMP ... Scan: front clear</text>
  <text x="60" y="385" class="small" text-anchor="start">0.34 m, farthest >8 m; ...”</text>
  <text x="44" y="406" class="t" text-anchor="start">2. Memory: keeps the last entry (goldfish),</text>
  <text x="60" y="423" class="small" text-anchor="start">10 (window), all (full), plus a notebook.</text>
  <text x="44" y="446" class="t" text-anchor="start">3. Builds a request, sends it, gets a reply.</text>
  <text x="44" y="463" class="t" text-anchor="start">4. Runs the tool the reply asks for.</text>
  <rect x="450" y="66" width="284" height="170" rx="12" fill="#232838" stroke="#f4a6c0" stroke-width="1.5"/>
  <text x="466" y="90" class="h" text-anchor="start">Prompt cache</text>
  <text x="466" y="114" class="t" text-anchor="start">Remembers the beginning of recent</text>
  <text x="466" y="131" class="t" text-anchor="start">requests for 5 minutes.</text>
  <text x="466" y="148" class="t" text-anchor="start">If the next request starts with the</text>
  <text x="466" y="165" class="t" text-anchor="start">same text, that part is read back at</text>
  <text x="466" y="182" class="t" text-anchor="start">1/10 of the price, and faster.</text>
  <text x="466" y="199" class="t" text-anchor="start">Any change ends the match there.</text>
  <rect x="450" y="304" width="284" height="178" rx="12" fill="#232838" stroke="#f4a6c0" stroke-width="1.5"/>
  <g transform="translate(486,356) scale(0.9)"><path d="M-2,-22 C-12,-28 -27,-21 -26,-10 C-34,-6 -33,8 -25,12 C-25,22 -12,26 -2,21 Z" fill="#f4a6c0"/><path d="M2,-22 C12,-28 27,-21 26,-10 C34,-6 33,8 25,12 C25,22 12,26 2,21 Z" fill="#f4a6c0"/></g>
  <text x="526" y="342" class="h" text-anchor="start">Claude Haiku 5.5</text>
  <text x="526" y="360" class="small" text-anchor="start">the model</text>
  <text x="466" y="396" class="t" text-anchor="start">Reads the whole request, thinks</text>
  <text x="466" y="413" class="t" text-anchor="start">(hidden, billed as output), and</text>
  <text x="466" y="430" class="t" text-anchor="start">answers with one sentence and</text>
  <text x="466" y="447" class="t" text-anchor="start">one tool call. It keeps nothing</text>
  <text x="466" y="464" class="t" text-anchor="start">between calls.</text>
