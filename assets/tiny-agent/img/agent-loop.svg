<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The agent loop</title>
  <desc id="d">You give a task to the model (the brain). The model either answers and is done, or asks for a tool. The tools (the hands) read, write and run things. The results (the eyes) are sent back to the model, and the loop repeats.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb4ff"/>
    </marker>
    <marker id="arrow-done" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3e88d"/>
    </marker>
    <style>
      .card  { fill: #232838; stroke: #343b4d; stroke-width: 1.5; }
      .title { fill: #d6dae4; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .sub   { fill: #8a93a6; font-size: 14px; text-anchor: middle; }
      .flow  { fill: none; stroke: #7fb4ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { fill: #aeb6c8; font-size: 14px; font-style: italic; }
      .line  { fill: none; stroke: #1b1f2a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ===== the loop arrows (drawn first, under the cards) ===== -->
  <!-- brain -> hands -->
  <path class="flow" d="M468,120 C560,120 640,140 640,196"/>
  <text class="label" x="560" y="112">“please run</text>
  <text class="label" x="560" y="130">tool X with Y”</text>
  <!-- hands -> eyes -->
  <path class="flow" d="M640,316 C640,400 560,410 470,410"/>
  <text class="label" x="580" y="430" text-anchor="middle">what happened</text>
  <!-- eyes -> brain -->
  <path class="flow" d="M290,410 C150,410 120,300 120,250 C120,170 200,120 290,120"/>
  <text class="label" x="40" y="290">sent back to</text>
  <text class="label" x="40" y="308">the model</text>

  <!-- repeat, in the middle -->
  <g transform="translate(380,265)">
    <path d="M-26,-10 A28,28 0 1 1 -10,26" fill="none" stroke="#5b6478" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="0" y="6" fill="#8a93a6" font-size="15" text-anchor="middle">repeat</text>
  </g>

  <!-- task -> brain -->
  <path class="flow" d="M150,62 L290,62"/>
  <!-- brain -> done -->
  <path d="M468,62 L590,62" fill="none" stroke="#c3e88d" stroke-width="2.5" marker-end="url(#arrow-done)"/>
  <text class="label" x="532" y="48" text-anchor="middle" font-size="13">“here is my answer”</text>

  <!-- ===== you ===== -->
  <g transform="translate(20,20)">
    <rect class="card" width="130" height="84" rx="12"/>
    <g transform="translate(65,30)">
      <circle cy="-6" r="8" fill="#aeb6c8"/>
      <path d="M-14,16 Q-14,4 0,4 Q14,4 14,16 Z" fill="#aeb6c8"/>
    </g>
    <text class="title" x="65" y="72">your task</text>
  </g>

  <!-- ===== the model: brain ===== -->
  <g transform="translate(290,20)">
    <rect class="card" width="178" height="130" rx="14"/>
    <g transform="translate(89,42)">
      <path d="M-2,-22 C-12,-28 -27,-21 -26,-10 C-34,-6 -33,8 -25,12 C-25,22 -12,26 -2,21 Z" fill="#f4a6c0"/>
      <path d="M2,-22 C12,-28 27,-21 26,-10 C34,-6 33,8 25,12 C25,22 12,26 2,21 Z" fill="#f4a6c0"/>
      <path class="line" d="M-17,-12 Q-10,-9 -9,-1 M-22,4 Q-15,2 -10,7 M-8,13 Q-6,6 -1,5"/>
      <path class="line" d="M17,-12 Q10,-9 9,-1 M22,4 Q15,2 10,7 M8,13 Q6,6 1,5"/>
    </g>
    <text class="title" x="89" y="96">the model</text>
    <text class="sub" x="89" y="116">reads, decides, asks</text>
  </g>

  <!-- ===== done ===== -->
  <g transform="translate(598,38)">
    <rect width="132" height="48" rx="24" fill="#24311f" stroke="#c3e88d" stroke-width="1.5"/>
    <path d="M30,24 L38,32 L52,16" fill="none" stroke="#c3e88d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="30" fill="#c3e88d" font-size="17" font-weight="600">done</text>
  </g>

  <!-- ===== the tools: hand ===== -->
  <g transform="translate(551,196)">
    <rect class="card" width="178" height="120" rx="14"/>
    <g transform="translate(89,40)" fill="#ffcb6b">
      <rect x="-12" y="-4" width="24" height="22" rx="7"/>
      <rect x="-12" y="-19" width="6" height="20" rx="3"/>
      <rect x="-5.5" y="-25" width="6" height="26" rx="3"/>
      <rect x="1" y="-26" width="6" height="27" rx="3"/>
      <rect x="7.5" y="-21" width="6" height="22" rx="3"/>
      <rect x="-21" y="-2" width="6" height="17" rx="3" transform="rotate(-38 -18 6)"/>
    </g>
    <text class="title" x="89" y="88">the tools</text>
    <text class="sub" x="89" y="108">read · write · run</text>
  </g>

  <!-- ===== the results: eye ===== -->
  <g transform="translate(290,345)">
    <rect class="card" width="178" height="120" rx="14"/>
    <g transform="translate(89,38)">
      <path d="M-30,0 Q0,-24 30,0 Q0,24 -30,0 Z" fill="#e8ecf4"/>
      <circle r="11" fill="#82aaff"/>
      <circle r="5" fill="#1b1f2a"/>
      <circle cx="3.5" cy="-3.5" r="2" fill="#ffffff"/>
    </g>
    <text class="title" x="89" y="88">the results</text>
    <text class="sub" x="89" y="108">output · errors · images</text>
  </g>
</svg>
