<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Step 0: a chatbot</title>
  <desc id="d">The model can only talk. It tells you what code to type; you run it, read the output and errors, and paste them back. You are the hands and the eyes: you are the loop.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7fb4ff"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3e88d"/></marker>
    <marker id="a-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffcb6b"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f78c6c"/></marker>
    <style>
      .title { fill: #d6dae4; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .sub   { fill: #8a93a6; font-size: 14px; text-anchor: middle; }
      .label { fill: #aeb6c8; font-size: 14px; font-style: italic; }
      .line  { fill: none; stroke: #1b1f2a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <path d="M468,120 C560,120 640,140 640,196" fill="none" stroke="#7fb4ff" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text class="label" x="560" y="112" text-anchor="start" font-size="14">“type this</text><text class="label" x="560" y="130" text-anchor="start" font-size="14">code”</text>
  <path d="M640,316 C640,400 560,410 470,410" fill="none" stroke="#f78c6c" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text class="label" x="580" y="432" text-anchor="middle" font-size="14">output, errors</text>
  <path d="M290,410 C150,410 120,300 120,250 C120,170 200,120 290,120" fill="none" stroke="#f78c6c" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text class="label" x="140" y="292" text-anchor="start" font-size="14">you paste</text><text class="label" x="140" y="310" text-anchor="start" font-size="14">it back</text>
  <g transform="translate(380,265)"><path d="M-26,-10 A28,28 0 1 1 -10,26" fill="none" stroke="#5b6478" stroke-width="2.5" marker-end="url(#a-blue)"/><text y="6" fill="#8a93a6" font-size="15" text-anchor="middle">repeat</text></g>
  <path d="M150,62 L290,62" fill="none" stroke="#7fb4ff" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <path d="M468,62 L590,62" fill="none" stroke="#c3e88d" stroke-width="2.5" marker-end="url(#a-green)"/>
  <text class="label" x="536" y="86" text-anchor="middle" font-size="13">“here is my answer”</text>
  <g transform="translate(20,20)"><rect width="130" height="84" rx="12" fill="#232838" stroke="#343b4d" stroke-width="1.5"/><g transform="translate(65,30)"><circle cy="-6" r="8" fill="#aeb6c8"/><path d="M-14,16 Q-14,4 0,4 Q14,4 14,16 Z" fill="#aeb6c8"/></g><text class="title" x="65" y="72">your task</text></g>
  <g transform="translate(290,20)"><rect width="178" height="130" rx="14" fill="#232838" stroke="#343b4d" stroke-width="1.5"/><g transform="translate(89.0,42)"><path d="M-2,-22 C-12,-28 -27,-21 -26,-10 C-34,-6 -33,8 -25,12 C-25,22 -12,26 -2,21 Z" fill="#f4a6c0"/><path d="M2,-22 C12,-28 27,-21 26,-10 C34,-6 33,8 25,12 C25,22 12,26 2,21 Z" fill="#f4a6c0"/><path class="line" d="M-17,-12 Q-10,-9 -9,-1 M-22,4 Q-15,2 -10,7 M-8,13 Q-6,6 -1,5"/><path class="line" d="M17,-12 Q10,-9 9,-1 M22,4 Q15,2 10,7 M8,13 Q6,6 1,5"/></g><text class="title" x="89.0" y="98">the model</text><text class="sub" x="89.0" y="118">reads, decides, asks</text></g>
  <g transform="translate(598,38)"><rect width="132" height="48" rx="24" fill="#24311f" stroke="#c3e88d" stroke-width="1.5"/><path d="M30,24 L38,32 L52,16" fill="none" stroke="#c3e88d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="30" fill="#c3e88d" font-size="17" font-weight="600">done</text></g>
  <g transform="translate(551,196)"><rect width="178" height="120" rx="14" fill="#232838" stroke="#f78c6c" stroke-width="1.5"/><g transform="translate(89.0,34)"><circle cy="-6" r="8" fill="#f78c6c"/><path d="M-14,16 Q-14,4 0,4 Q14,4 14,16 Z" fill="#f78c6c"/></g><text class="title" x="89.0" y="88">you run it</text><text class="sub" x="89.0" y="108">copy · paste · run</text></g>
  <g transform="translate(290,345)"><rect width="178" height="120" rx="14" fill="#232838" stroke="#f78c6c" stroke-width="1.5"/><g transform="translate(89.0,34)"><circle cy="-6" r="8" fill="#f78c6c"/><path d="M-14,16 Q-14,4 0,4 Q14,4 14,16 Z" fill="#f78c6c"/></g><text class="title" x="89.0" y="88">you read it</text><text class="sub" x="89.0" y="108">and report back</text></g>
</svg>
