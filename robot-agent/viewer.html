<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot replay</title>
<style>
  body { background: #1b1f2a; color: #d6dae4; font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  main { max-width: 560px; margin: 0 auto; }
  .drop { border: 2px dashed #465069; border-radius: 6px; padding: 14px; text-align: center; color: #8a93a6; }
  .drop.over { border-color: #7be495; }
  code { color: #ffd166; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.3em">Robot replay</h1>
  <div class="drop" id="drop">
    Drop a <code>replay.json</code> here, or <input type="file" id="file" accept=".json">
    <div style="font-size:13px;margin-top:6px">Or serve this folder (<code>python3 -m http.server</code>)
    and open <code>viewer.html?src=runs/&lt;batch&gt;/&lt;run&gt;/replay.json</code></div>
  </div>
  <div id="player"></div>
</main>
<script src="../assets/robot-agent/replay.js"></script>
<script>
  var src = new URLSearchParams(location.search).get('src');
  var holder = document.getElementById('player');
  var player = null;
  if (src) { holder.setAttribute('data-robot-replay', src); RobotReplay.init(); }
  function show(text) {
    if (!player) player = new RobotReplay.Player(holder, [], []);
    player.loadData(JSON.parse(text));
  }
  document.getElementById('file').onchange = function (e) {
    var f = e.target.files[0]; if (f) f.text().then(show);
  };
  var drop = document.getElementById('drop');
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) {
    e.preventDefault(); drop.classList.remove('over');
    var f = e.dataTransfer.files[0]; if (f) f.text().then(show);
  };
</script>
</body>
</html>
